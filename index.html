<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style2.css" />
    <script
      src="https://kit.fontawesome.com/4609a979eb.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <section id="about-me">
      <nav>
        <div class="personal__logo">Emmanuel Rivera</div>
        <ul class="nav__link--list">
          <li>
            <a
              href=""
              class="nav__link--anchor link__hover--effect link__hover--effect--black"
              >Languages</a
            >
          </li>
          <li>
            <a
              href=""
              class="nav__link--anchor link__hover--effect link__hover--effect--black"
              >Project</a
            >
          </li>
          <li>
            <a href="" class="nav__link--anchor nav__link--anchor--primary"
              >Contact</a
            >
          </li>
        </ul>
      </nav>

      <div class="flex flex-1">
        <div class="about-me__info row">
          <div class="about-me__info--container">
            <figure class="about-me__picture--mask">
              <img
                src="./Photoroom_20250524_210815.jpeg"
                class="about-me__picture"
                alt=""
              />
            </figure>
            <h1 class="about-me__info--title">
              Hello! I'm <span class="text-purple">Emmanuel Rivera</span>👋
            </h1>
            <p class="about-me__info--para">
              Aspiring
              <strong class="text-purple">frontend software developer,</strong>
              striving to build top-tier web applications for real-world
              purposes.
            </p>
            <div class="about-me__links">
              <a href="" class="about-me__links">
                <i class="fa-brands fa-linkedin"></i>
              </a>
              <a href="" class="about-me__links">
                <i class="fa-brands fa-github"></i>
              </a>
              <a href="" class="about-me__links">
                <i class="fa-solid fa-envelope"></i>
              </a>
              <a href="" class="about-me__links">
                <i class="fa-solid fa-file-pdf"></i>
              </a>
            </div>
          </div>
          <figure class="about-me__img--container">
            <img
              src="./Screenshot 2025-05-24 223018.png"
              class="about-me__img"
              alt=""
            />
          </figure>
        </div>
      </div>
    </section>

    <section id="languages">
      <div class="container">
        <div class="row">
          <h1 class="section__title">
            This is my <span class="text-purple">technology stack</span>
          </h1>
          <div class="language__list">
            <div class="language">
              <figure class="language__img--wrapper">
                <img
                  src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/38/HTML5_Badge.svg/240px-HTML5_Badge.svg.png"
                  alt="Html Logo"
                  class="language__img"
                />
              </figure>
            </div>
            <div class="language">
              <figure class="language__img--wrapper">
                <img
                  src="https://cdn.iconscout.com/icon/free/png-256/css-131-722685.png"
                  alt="CSS Logo"
                  class="language__img"
                />
              </figure>
            </div>
            <div class="language">
              <figure class="language__img--wrapper">
                <img
                  src="https://cdn.iconscout.com/icon/free/png-256/javascript-1-225993.png"
                  alt="JavaScript Logo"
                  class="language__img"
                />
              </figure>
            </div>
            <div class="language">
              <figure class="language__img--wrapper">
                <img
                  src="https://cdn.iconscout.com/icon/free/png-256/typescript-3521774-2945272.png"
                  alt="TypeScript Logo"
                  class="language__img"
                />
              </figure>
            </div>
            <div class="language">
              <figure class="language__img--wrapper">
                <img
                  src="https://cdn.iconscout.com/icon/free/png-256/vue-282497.png"
                  alt="Vue Logo"
                  class="language__img"
                />
              </figure>
            </div>
            <div class="language">
              <figure class="language__img--wrapper">
                <img
                  src="https://cdn.iconscout.com/icon/free/png-256/nuxt-dot-js-3628959-3030184.png"
                  alt="Nuxt Logo"
                  class="language__img"
                />
              </figure>
            </div>
            <div class="language">
              <figure class="language__img--wrapper">
                <img
                  src="https://cdn.iconscout.com/icon/free/png-256/react-3-1175109.png"
                  alt="React Logo"
                  class="language__img"
                />
              </figure>
            </div>
            <div class="language">
              <figure class="language__img--wrapper">
                <img
                  src="https://mobx.js.org/img/mobx.png"
                  alt="MobX Logo"
                  class="language__img"
                />
              </figure>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
